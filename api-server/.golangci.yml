# golangci-lint 設定（v2）— 旧 api/ と同じ品質バーを新構成にも適用する
# 実行: golangci-lint run ./...（インストール: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest）
# 参考: https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  enable:
    # 標準セット
    - govet
    - staticcheck
    - errcheck
    - unused
    # 追加: セキュリティ・エラーハンドリング・状態機械の網羅性
    - gosec # セキュリティ検査（SQL連結・タイムアウト無しサーバー等）
    - errorlint # errors.Is/As・%w の誤用検出
    - exhaustive # 列挙値switchの網羅漏れ検出（状態機械の遷移表で効く）
    - usestdlibvars # http.StatusOK 等の標準定数を強制
    - unconvert # 不要な型変換
    - modernize # 新しい標準ライブラリへの置き換え提案
    - bidichk # 不可視Unicode制御文字（Trojan Source）検出
    - bodyclose # HTTPレスポンスBodyのClose漏れ（外部API連携時に効く）
    - depguard # 依存方向の強制（アーキテクチャ図を lint 設定に翻訳する）
  exclusions:
    # 生成物は lint 対象外（直すなら仕様か生成設定を直して再生成する）
    paths:
      - generated/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
  settings:
    # 依存の向き（設計プラン§4）: handler → usecase → generated/db。
    # domain は何にも依存しない。company ⇔ talent は相互に依存しない（ADR-0003）
    depguard:
      rules:
        domain-purity:
          list-mode: lax # 列挙した deny だけを禁止する
          files:
            - '**/internal/shared/domain/**'
          deny:
            - pkg: github.com/masahiro96848/it-matching-service-clean-architecture/api-server/internal/shared/infra
              desc: domain は infra（DB接続）に依存しない
            - pkg: github.com/masahiro96848/it-matching-service-clean-architecture/api-server/generated
              desc: domain は生成物（DB・API型）に依存しない
            - pkg: net/http
              desc: domain は HTTP に依存しない
        company-isolation:
          list-mode: lax
          files:
            - '**/internal/company/**'
          deny:
            - pkg: github.com/masahiro96848/it-matching-service-clean-architecture/api-server/internal/talent
              desc: company から talent へ依存しない（視点の分離・ADR-0003）
        talent-isolation:
          list-mode: lax
          files:
            - '**/internal/talent/**'
          deny:
            - pkg: github.com/masahiro96848/it-matching-service-clean-architecture/api-server/internal/company
              desc: talent から company へ依存しない（視点の分離・ADR-0003）
    staticcheck:
      checks:
        - "all"
        - "-ST1000" # パッケージコメント必須は学習リポジトリには過剰
    errcheck:
      # x.(T) を , ok なしで使うことを禁止（パニックの芽を摘む）
      check-type-assertions: true
      # check-blank は無効のまま: `_ = f()` は「判断して捨てた」印として許可する
      # （捨てる箇所には理由コメントを書く運用。詳細は docs/バックエンド.md）

formatters:
  exclusions:
    paths:
      - generated/
  enable:
    - gofumpt # gofmt の厳格版
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/masahiro96848/it-matching-service-clean-architecture/api-server

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  # 既定の件数上限を撤廃し、常に全件表示する（CIでの見逃し防止）
  max-issues-per-linter: 0
  max-same-issues: 0
