# oapi-codegen の設定（OpenAPI → Go）: talent 系統
# 実行: go tool oapi-codegen -config oapi-codegen-talent.yaml ../packages/spec/openapi-talent.yaml
package: talent
output: generated/api/talent/api.gen.go
generate:
  models: true # スキーマ → Go の型
  std-http-server: true # net/http 標準のルーター登録コード
  strict-server: true # 型付き req/res のインターフェース（実装対象）
