# air（ホットリロード）設定
# 起動: make dev-api（または cd api && air）
# インストール: go install github.com/air-verse/air@latest

root = "."
tmp_dir = "tmp"

[build]
# ビルド成果物は tmp/ 配下に置く（.gitignore 済み）
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
# テストファイルの変更では再起動しない
exclude_regex = ["_test\\.go"]
exclude_dir = ["tmp"]
include_ext = ["go", "env"]
# 保存連打時に再ビルドをまとめる待ち時間（ミリ秒）
delay = 300

[log]
# airのログに時刻を付ける（apiのログと見分けやすくする）
time = true

[misc]
# 終了時に tmp/ を掃除
clean_on_exit = true
