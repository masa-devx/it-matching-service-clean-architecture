# ローカル開発環境: PostgreSQL のみ
# アプリ（Go / Next.js）の起動は `pnpm dev`（Turborepo）に一本化している
# 起動:   docker compose up -d db  （または make db-up）
# DBに入る: docker compose exec db psql -U tsunagu -d tsunagu
# ★DBのホストポートは 5435（5432=ローカルPostgres・5433=todo-app・5434=tsunagu-works と衝突回避）
# ★コンテナ名・ボリューム名は tsunagu-arch- 接頭辞（tsunagu-works 側と同時起動できるように分離）

services:
  db:
    image: postgres:16
    container_name: tsunagu-arch-db
    environment:
      POSTGRES_USER: tsunagu
      POSTGRES_PASSWORD: tsunagu # ローカル学習用
      POSTGRES_DB: tsunagu
    ports:
      - '5435:5432'
    volumes:
      - tsunagu-arch-db-data:/var/lib/postgresql/data
    healthcheck:
      # 「コンテナ起動」ではなく「接続受付開始」を判定する
      test: ['CMD-SHELL', 'pg_isready -U tsunagu -d tsunagu']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tsunagu-arch-db-data:
