# 新構成（api-server/ packages/ ほか）の CI: turbo で lint → build（ローカルと同一コマンド）
# 旧構成の CI は api-ci.yml / web-ci.yml が担当（パスで棲み分け）
name: monorepo-ci

on:
  pull_request:
    paths:
      - 'api-server/**'
      - 'packages/**'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/monorepo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'api-server/**'
      - 'packages/**'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/monorepo-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm はルート package.json の packageManager フィールドをバージョンの単一の真実にする
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: api-server/go.mod
          # go.sum がまだ無い（依存ゼロ）ためキャッシュは無効。依存追加時に有効化する
          cache: false

      # go install はソースからのビルドで数分かかるため、公式スクリプトでバイナリを取得する
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo のローカルキャッシュを CI でも共有（変更のないパッケージはスキップされる）
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint & Build
        run: pnpm turbo lint build
