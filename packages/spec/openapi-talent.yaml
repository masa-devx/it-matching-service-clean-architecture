openapi: 3.0.0
info:
  title: Tsunagu Works Talent API
  description: |-
    人材向け API。/talent プレフィックスはサーバー側のマウント時に付与する
    （company と対称の構成。共通モデルは shared/models.tsp の import で再利用する）
  version: 0.0.0
tags: []
paths:
  /applications:
    post:
      operationId: Applications_create
      description: 応募する（公開中の案件のみ・同じ案件への二重応募は409）
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Application'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.ApplicationCreateInput'
      security:
        - BearerAuth: []
    get:
      operationId: Applications_list
      description: 自分の応募一覧（新しい順・案件タイトル込み）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApplicationList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /applications/{id}/withdraw:
    post:
      operationId: Applications_withdraw
      description: 応募を取り下げる（applied / offered から。決着済みは409）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Application'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /auth/login:
    post:
      operationId: Auth_login
      description: ログイン
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.LoginInput'
  /auth/me:
    get:
      operationId: Auth_me
      description: ログイン中ユーザーの情報（要認証）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.TalentMe'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /auth/signup:
    post:
      operationId: Auth_signup
      description: サインアップ（アカウントとプロフィールを同時作成し、トークンを発行する）
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.TalentSignupInput'
  /projects:
    get:
      operationId: Projects_list
      description: 公開中の案件一覧（seek ページネーション・検索。未公開は含まれない）
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前ページの next_cursor を渡すと、そこから続きを読む
          schema:
            type: integer
            format: int64
          explode: false
        - name: limit
          in: query
          required: false
          description: 取得件数（既定20・最大50にクランプされる）
          schema:
            type: integer
            format: int32
          explode: false
        - name: skills
          in: query
          required: false
          description: 指定スキルを全て持つ案件に絞る（AND）
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: remote_ok
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: min_hourly_rate
          in: query
          required: false
          description: 時給下限がこの額以上の案件に絞る
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ProjectPage'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /projects/{id}:
    get:
      operationId: Projects_get
      description: 公開中の案件詳細（未公開は404）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
components:
  schemas:
    TsunaguWorks.ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        request_id:
          type: string
      description: エラーレスポンスの共通形
    TsunaguWorks.Application:
      type: object
      required:
        - id
        - project_id
        - project_title
        - status
        - message
        - created_at
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        project_title:
          type: string
          description: 応募先案件のタイトル（一覧表示用）
        status:
          $ref: '#/components/schemas/TsunaguWorks.ApplicationStatus'
        message:
          type: string
          description: 志望動機
        created_at:
          type: string
          format: date-time
      description: 応募（talent 視点。project_title は projects との JOIN で供給する）
    TsunaguWorks.ApplicationCreateInput:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: integer
          format: int64
        message:
          type: string
          maxLength: 2000
          description: 志望動機（任意）
      description: 応募の作成入力（talent_id はトークンから・status は applied 固定のため含めない）
    TsunaguWorks.ApplicationList:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/TsunaguWorks.Application'
      description: 応募一覧のレスポンス
    TsunaguWorks.ApplicationStatus:
      type: string
      enum:
        - applied
        - offered
        - accepted
        - rejected
        - withdrawn
        - declined
      description: 応募の選考状態（遷移の許可は shared/domain の遷移表が一次情報）
    TsunaguWorks.AuthToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
      description: 認証トークン（web は httpOnly Cookie に変換して保持し、ブラウザ JS には渡さない）
    TsunaguWorks.LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: ログイン入力
    TsunaguWorks.Project:
      type: object
      required:
        - id
        - title
        - description
        - hourly_rate_min
        - hourly_rate_max
        - hours_per_week
        - remote_ok
        - required_skills
        - status
        - created_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 5000
        hourly_rate_min:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 想定時給の下限（円）。未設定は null
        hourly_rate_max:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 想定時給の上限（円）。未設定は null
        hours_per_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: 週の想定稼働時間
        remote_ok:
          type: boolean
        required_skills:
          type: array
          items:
            type: string
          description: '必須スキル（例: ["Go", "PostgreSQL"]）'
        status:
          $ref: '#/components/schemas/TsunaguWorks.ProjectStatus'
        created_at:
          type: string
          format: date-time
      description: 案件（企業が掲載する仕事）
    TsunaguWorks.ProjectPage:
      type: object
      required:
        - projects
        - next_cursor
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/TsunaguWorks.Project'
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: 次ページの読み出し起点となる id。null なら最終ページ
      description: 公開案件の1ページ（seek ページネーション）
    TsunaguWorks.ProjectStatus:
      type: string
      enum:
        - draft
        - published
        - closed
      description: 案件の掲載状態
    TsunaguWorks.TalentMe:
      type: object
      required:
        - user_id
        - email
        - display_name
        - skills
        - bio
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        display_name:
          type: string
        skills:
          type: array
          items:
            type: string
        bio:
          type: string
      description: ログイン中の人材ユーザー情報
    TsunaguWorks.TalentSignupInput:
      type: object
      required:
        - email
        - password
        - display_name
        - skills
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: パスワード（上限は bcrypt の入力上限 72 バイトに合わせる）
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 表示名
        skills:
          type: array
          items:
            type: string
          description: 'スキル（例: ["Go", "PostgreSQL"]）'
        bio:
          type: string
          maxLength: 1000
      description: 人材のサインアップ入力（アカウントとプロフィールを同時に作る）
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
