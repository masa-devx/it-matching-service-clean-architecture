openapi: 3.0.0
info:
  title: Tsunagu Works Talent API
  description: |-
    人材向け API。/talent プレフィックスはサーバー側のマウント時に付与する
    （company と対称の構成。共通モデルは shared/models.tsp の import で再利用する）
  version: 0.0.0
tags: []
paths:
  /auth/login:
    post:
      operationId: Auth_login
      description: ログイン
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.LoginInput'
  /auth/me:
    get:
      operationId: Auth_me
      description: ログイン中ユーザーの情報（要認証）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.TalentMe'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /auth/signup:
    post:
      operationId: Auth_signup
      description: サインアップ（アカウントとプロフィールを同時作成し、トークンを発行する）
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.TalentSignupInput'
components:
  schemas:
    TsunaguWorks.ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        request_id:
          type: string
      description: エラーレスポンスの共通形
    TsunaguWorks.AuthToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
      description: 認証トークン（web は httpOnly Cookie に変換して保持し、ブラウザ JS には渡さない）
    TsunaguWorks.LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: ログイン入力
    TsunaguWorks.TalentMe:
      type: object
      required:
        - user_id
        - email
        - display_name
        - skills
        - bio
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        display_name:
          type: string
        skills:
          type: array
          items:
            type: string
        bio:
          type: string
      description: ログイン中の人材ユーザー情報
    TsunaguWorks.TalentSignupInput:
      type: object
      required:
        - email
        - password
        - display_name
        - skills
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: パスワード（上限は bcrypt の入力上限 72 バイトに合わせる）
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 表示名
        skills:
          type: array
          items:
            type: string
          description: 'スキル（例: ["Go", "PostgreSQL"]）'
        bio:
          type: string
          maxLength: 1000
      description: 人材のサインアップ入力（アカウントとプロフィールを同時に作る）
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
