openapi: 3.0.0
info:
  title: Tsunagu Works Company API
  description: |-
    企業向け API。/company プレフィックスはサーバー側のマウント時に付与する
    （仕様は「company API の中身」だけを定義し、どこに載せるかは実装の関心事とする）
  version: 0.0.0
tags: []
paths:
  /applications/{id}/offer:
    post:
      operationId: Applications_offer
      description: オファーする（applied → offered。それ以外の状態は409）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApplicationForCompany'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /applications/{id}/reject:
    post:
      operationId: Applications_reject
      description: 不採用にする（applied → rejected。それ以外の状態は409）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApplicationForCompany'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /auth/login:
    post:
      operationId: Auth_login
      description: ログイン
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.LoginInput'
  /auth/me:
    get:
      operationId: Auth_me
      description: ログイン中ユーザーの情報（要認証）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.CompanyMe'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /auth/signup:
    post:
      operationId: Auth_signup
      description: サインアップ（アカウントとプロフィールを同時作成し、トークンを発行する）
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.AuthToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.CompanySignupInput'
  /projects:
    post:
      operationId: Projects_create
      description: 案件を作成する（draft として作成される・要認証。所有者はトークンから決まる）
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.ProjectCreateInput'
      security:
        - BearerAuth: []
    get:
      operationId: Projects_list
      description: 自社の案件一覧（下書き含む・新しい順）
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ProjectList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /projects/{id}:
    get:
      operationId: Projects_get
      description: 自社の案件詳細
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
    patch:
      operationId: Projects_update
      description: 編集（公開状態は変わらない。状態の変更は publish / unpublish / close で行う）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TsunaguWorks.ProjectUpdateInput'
      security:
        - BearerAuth: []
  /projects/{id}/applications:
    get:
      operationId: Projects_listApplications
      description: 自社案件に届いた応募の一覧（応募者プロフィール込み・他社の案件は404）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApplicationForCompanyList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /projects/{id}/close:
    post:
      operationId: Projects_close
      description: 募集を終了する（published → closed。再募集は publish）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /projects/{id}/publish:
    post:
      operationId: Projects_publish
      description: 公開する（draft / closed → published。遷移の可否は掲載状態の遷移表が決める）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
  /projects/{id}/unpublish:
    post:
      operationId: Projects_unpublish
      description: 非公開にする（published → draft）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.Project'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TsunaguWorks.ApiError'
      security:
        - BearerAuth: []
components:
  schemas:
    TsunaguWorks.ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        request_id:
          type: string
      description: エラーレスポンスの共通形
    TsunaguWorks.ApplicationForCompany:
      type: object
      required:
        - id
        - project_id
        - status
        - message
        - talent_display_name
        - talent_skills
        - created_at
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TsunaguWorks.ApplicationStatus'
        message:
          type: string
          description: 志望動機
        talent_display_name:
          type: string
          description: 応募者の表示名
        talent_skills:
          type: array
          items:
            type: string
          description: 応募者のスキル
        created_at:
          type: string
          format: date-time
      description: 応募（company 視点。選考のための応募者プロフィールを JOIN で供給する）
    TsunaguWorks.ApplicationForCompanyList:
      type: object
      required:
        - applications
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/TsunaguWorks.ApplicationForCompany'
      description: 自社案件に届いた応募一覧のレスポンス
    TsunaguWorks.ApplicationStatus:
      type: string
      enum:
        - applied
        - offered
        - accepted
        - rejected
        - withdrawn
        - declined
      description: 応募の選考状態（遷移の許可は shared/domain の遷移表が一次情報）
    TsunaguWorks.AuthToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
      description: 認証トークン（web は httpOnly Cookie に変換して保持し、ブラウザ JS には渡さない）
    TsunaguWorks.CompanyMe:
      type: object
      required:
        - user_id
        - email
        - name
        - location
        - description
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string
      description: ログイン中の企業ユーザー情報
    TsunaguWorks.CompanySignupInput:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
          description: パスワード（上限は bcrypt の入力上限 72 バイトに合わせる）
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 会社名
        location:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
      description: 企業のサインアップ入力（アカウントとプロフィールを同時に作る）
    TsunaguWorks.LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: ログイン入力
    TsunaguWorks.Project:
      type: object
      required:
        - id
        - title
        - description
        - hourly_rate_min
        - hourly_rate_max
        - hours_per_week
        - remote_ok
        - required_skills
        - status
        - created_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 5000
        hourly_rate_min:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 想定時給の下限（円）。未設定は null
        hourly_rate_max:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: 想定時給の上限（円）。未設定は null
        hours_per_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: 週の想定稼働時間
        remote_ok:
          type: boolean
        required_skills:
          type: array
          items:
            type: string
          description: '必須スキル（例: ["Go", "PostgreSQL"]）'
        status:
          $ref: '#/components/schemas/TsunaguWorks.ProjectStatus'
        created_at:
          type: string
          format: date-time
      description: 案件（企業が掲載する仕事）
    TsunaguWorks.ProjectCreateInput:
      type: object
      required:
        - title
        - description
        - hours_per_week
        - remote_ok
        - required_skills
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 5000
        hourly_rate_min:
          type: integer
          format: int32
          minimum: 0
        hourly_rate_max:
          type: integer
          format: int32
          minimum: 0
        hours_per_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        remote_ok:
          type: boolean
        required_skills:
          type: array
          items:
            type: string
      description: 案件の作成入力（status はサーバー側で draft 固定のため含めない）
    TsunaguWorks.ProjectList:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/TsunaguWorks.Project'
      description: 案件一覧のレスポンス
    TsunaguWorks.ProjectStatus:
      type: string
      enum:
        - draft
        - published
        - closed
      description: 案件の掲載状態
    TsunaguWorks.ProjectUpdateInput:
      type: object
      required:
        - title
        - description
        - hours_per_week
        - remote_ok
        - required_skills
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 5000
        hourly_rate_min:
          type: integer
          format: int32
          minimum: 0
        hourly_rate_max:
          type: integer
          format: int32
          minimum: 0
        hours_per_week:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        remote_ok:
          type: boolean
        required_skills:
          type: array
          items:
            type: string
      description: 案件の編集入力（作成と同じ形を spread で再利用。status を含めない＝編集で公開状態は変わらない）
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
